[project]
name = "hes-hackathon"
version = "0.1.0"
description = "Local live-transcription and evidence-based fact-checking prototype"
readme = "README.md"
authors = [
    { name = "HES-SO Hackathon Team" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "av<19",
    "datasets>=5.1.0",
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "soundcard>=0.4.6",
    "sounddevice>=0.5.6",
    "sqlite-vec>=0.1.9",
    "torch>=2.14.1",
    "torchcodec>=0.17.0",
    "transformers>=5.20.2",
    "ddgs==9.16.0",
    "trafilatura==2.3.1",
    "pysbd>=0.3.4",
    "fastapi[standard]>=0.159.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[project.scripts]
hes-hackathon = "hes_hackathon:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
