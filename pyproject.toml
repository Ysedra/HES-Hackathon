[project]
name = "hes-hackathon"
version = "0.1.0"
description = "Local live-transcription and evidence-based fact-checking prototype"
readme = "README.md"
authors = [
    { name = "HES-SO Hackathon Team" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs==9.16.0",
    # PyTorch 2.2.2 is the last official release supporting Intel Macs;
    # that build also requires NumPy 1.x.
    "numpy==1.26.4",
    "sqlite-vec==0.1.9",
    "torch==2.2.2",
    "trafilatura==2.3.1",
    "transformers==4.46.3",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
]

[project.scripts]
hes-hackathon = "hes_hackathon:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
